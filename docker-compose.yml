services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: droit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-droit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-droit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-droit_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-droit} -d ${POSTGRES_DB:-droit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector DB ───────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: droit_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat /dev/null > /dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Phase 4: caching + session context) ────────────────────────────
  # Included now so the compose file is complete; start with:
  #   docker compose --profile cache up -d
  redis:
    image: redis:7-alpine
    container_name: droit_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - cache

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
